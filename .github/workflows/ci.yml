name: Selenium QA CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1
      - name: Run tests
        run: mvn --batch-mode -Dheadless=true clean test
